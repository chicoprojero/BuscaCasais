<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presença de Casais 2026</title>
<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  position:sticky;
  top:0;
  background:#fff;
  z-index:20;
  padding:14px 16px;
  box-shadow:0 1px 8px rgba(0,0,0,.16);
}
h2{margin:0 0 10px 0;font-size:21px}
.status{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:13px;
  color:#555;
  margin-bottom:10px;
}
.ok{color:#166534;font-weight:700}
.off{color:#991b1b;font-weight:700}
input[type="search"]{
  width:100%;
  padding:14px 12px;
  font-size:18px;
  border:1px solid #bbb;
  border-radius:10px;
  outline:none;
}
.resumo{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.box{
  flex:1;
  background:#f9fafb;
  border-radius:10px;
  padding:10px;
  text-align:center;
  border:1px solid #e5e7eb;
}
.numero{
  font-size:24px;
  font-weight:800;
}
.label{
  font-size:13px;
  color:var(--muted);
}
.abas{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.aba{
  flex:1;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:11px;
  font-size:15px;
  font-weight:800;
  background:#f9fafb;
  color:#374151;
}
.aba.ativa{
  background:#111827;
  color:#fff;
}
.aba.copiar{
  background:#dcfce7;
  color:#166534;
  border-color:#bbf7d0;
}
main{padding:10px 16px 44px}
.titulo-secao{
  font-size:18px;
  font-weight:800;
  margin:14px 0 8px;
}
.card{
  background:var(--card);
  padding:12px;
  margin:9px 0;
  border-radius:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.14);
  border-left:10px solid #999;
  display:flex;
  align-items:center;
  gap:10px;
}
.card.checked{opacity:.62}
.card.checked .casal{text-decoration:line-through}
.info{flex:1}
.casal{font-weight:800;font-size:16px;margin-bottom:4px}
.grupo{font-weight:700;font-size:14px}
.branco{font-size:13px;color:#444;margin-top:3px}
.check{
  width:30px;
  height:30px;
  flex:0 0 auto;
}
.verde{border-left-color:#00b050}.rosa{border-left-color:#ff00ff}.azul{border-left-color:#00c8d7}
.marrom{border-left-color:#8b4a08}.lilas{border-left-color:#b7a0d9}.vermelho{border-left-color:#ff0000}
.amarelo{border-left-color:#ffd000}.laranja{border-left-color:#ff9900}
.vazio{
  color:#666;
  text-align:center;
  margin-top:24px;
}
.aviso{
  font-size:13px;
  color:#555;
  margin-top:8px;
}
.titulo{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
  margin:0 0 10px 0;
  font-size:21px;
}

.credito{
  font-size:11px;
  font-weight:400;
  color:#9ca3af;
}
.footer{
  text-align:center;
  font-size:12px;
  color:#6b7280;
  padding:10px 8px 18px;
}
.footer a{
  color:#6b7280;
  text-decoration:none;
}
.footer a:hover{
  text-decoration:underline;
}





@media (max-width:520px){
  .status{
    flex-direction:column;
  }

  .aba{
    font-size:13px;
    padding:10px 6px;
  }
}
  
</style>
</head>
<body>
<header>
<h2 class="titulo">
  Presença de Casais 2026
  <span class="credito">by Francisco Moreira • @chicoprojeto_</span>
</h2>

  <div class="status">
    <div id="conexao" class="off">🔴 Conectando...</div>
    <div id="atualizacao">Última atualização: --:--:--</div>
  </div>

  <input id="busca" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Buscar casal, grupo ou casal branco...">

  <div class="resumo">
    <div class="box">
      <div id="total" class="numero">0</div>
      <div class="label">Total</div>
    </div>
    <div class="box">
      <div id="presentes" class="numero">0</div>
      <div class="label">Chegaram</div>
    </div>
    <div class="box">
      <div id="faltam" class="numero">0</div>
      <div class="label">Faltam</div>
    </div>
  </div>

  <div class="abas">
    <button id="btnFaltantes" class="aba ativa" onclick="mudarModo('faltantes')">Faltantes</button>
    <button id="btnPresentes" class="aba" onclick="mudarModo('presentes')">Presentes</button>
    <button class="aba copiar" onclick="copiarFaltantes()">  📋 Copiar</button>
  </div>

  <div class="aviso">Para corrigir, entre em Presentes e desmarque individualmente.</div>
</header>

<main>
  <div id="tituloLista" class="titulo-secao">Casais que ainda faltam</div>
  <div id="resultados"></div>
</main>

<div class="footer">
  by Francisco Moreira •
  <a href="https://instagram.com/chicoprojeto_" target="_blank" rel="noopener noreferrer">@chicoprojeto_</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNViUBatTQV_ZkrP3g5rYvgyUVQlbuyS8",
  authDomain: "presencacasais.firebaseapp.com",
  databaseURL: "https://presencacasais-default-rtdb.firebaseio.com",
  projectId: "presencacasais",
  storageBucket: "presencacasais.firebasestorage.app",
  messagingSenderId: "1098389414777",
  appId: "1:1098389414777:web:aef083b2f5aa272101c5a8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const presencaRef = ref(db, "presenca");

const dados = [
{n:1,casal:"AURÉLIO E NATÁLIA",grupo:"VERDE",branco:"Rapha e Kelly"},
{n:2,casal:"EDGAR E ÉRIKA",grupo:"VERDE",branco:"PV e Duda / Éder e Pri"},
{n:3,casal:"GEOMAR JUNIO E REBECCA",grupo:"VERDE",branco:"Geomar e Eliane"},
{n:4,casal:"NEUBER E KARINA",grupo:"VERDE",branco:"PV e Duda / Paulo e Bel"},
{n:5,casal:"RAFA (Rafael) E JANA (Janaina)",grupo:"VERDE",branco:"PV e Duda / Gui e Babi"},
{n:6,casal:"THALECO (Thalis) E ALINE",grupo:"VERDE",branco:"PV e Duda"},
{n:7,casal:"DERIK E MILLENA",grupo:"ROSA",branco:"Alan e Ester"},
{n:8,casal:"ESDRAS E VIVI (Viviane)",grupo:"ROSA",branco:"Judson e Lena"},
{n:9,casal:"JÔ (Josley) E JU (Juliana)",grupo:"ROSA",branco:"Alberto e Carol"},
{n:10,casal:"MATHEUS PAULO E NATHALIA",grupo:"ROSA",branco:"Gustavo e Bia"},
{n:11,casal:"RENATO E EVELLYN",grupo:"ROSA",branco:"Renato e Romilda"},
{n:12,casal:"VICTOR E KEMILLY",grupo:"ROSA",branco:"Lucas e Paloma"},
{n:13,casal:"ITALO E RAFA (Rafaela)",grupo:"AZUL",branco:"Arthur e Liria"},
{n:14,casal:"LÉO (Leonardo) E LUANA",grupo:"AZUL",branco:"Wilson e Fernanda"},
{n:15,casal:"RICHARDSON E VIVI (Virginia)",grupo:"AZUL",branco:"Athos e Camila"},
{n:16,casal:"ROGERIO E ROSANGELA",grupo:"AZUL",branco:"Vinicius e Jana"},
{n:17,casal:"SIMÕES (Lucas) E SABRINA",grupo:"AZUL",branco:"Kleber e Geci"},
{n:18,casal:"WILLIAM E ANA LUIZA",grupo:"AZUL",branco:"Jonathan e Iandra"},
{n:19,casal:"ALEXANDRE E MARA (Maria Lúcia)",grupo:"MARROM",branco:"Amós e Marly"},
{n:20,casal:"GUTO (Rogério) E DEBORA",grupo:"MARROM",branco:"Beto e Samanta"},
{n:21,casal:"ITALO E DAIANE",grupo:"MARROM",branco:"Patrick e Katherine"},
{n:22,casal:"JIZREEL E INGRID",grupo:"MARROM",branco:"Tiel e Brenda"},
{n:23,casal:"JONATAS E LUANA",grupo:"MARROM",branco:"Pr Gilbert"},
{n:24,casal:"NILSON E TALITHA",grupo:"MARROM",branco:"Rafa e Amanda"},
{n:25,casal:"AKNO E GLAYCE",grupo:"LILAS",branco:"Isaac e Nathalia"},
{n:26,casal:"DANILO E PRISCILA",grupo:"LILAS",branco:"Ramon e Carol"},
{n:27,casal:"GUSTAVO E SUZANE",grupo:"LILAS",branco:"Mauricio e Hosana"},
{n:28,casal:"KLEBER E RAFAELLE",grupo:"LILAS",branco:"Rafa e Amanda"},
{n:29,casal:"LUCAS E JOSI (Josianne)",grupo:"LILAS",branco:"Patrik e Katherine"},
{n:30,casal:"SÉRGIO E NÚBIA (Adenubia)",grupo:"LILAS",branco:"Paulo Jr e Verônica"},
{n:31,casal:"DIOGO E DEBORAH",grupo:"VERMELHO",branco:"Rafa e Amanda"},
{n:32,casal:"ELIOENAI E LARISSA",grupo:"VERMELHO",branco:"Douglas e Cristiane"},
{n:33,casal:"FELIPE E ESTER",grupo:"VERMELHO",branco:"Gustavo e Bia"},
{n:34,casal:"JOÃO E RAFA (Rafaela)",grupo:"VERMELHO",branco:"Welder e Polly"},
{n:35,casal:"JOÃO E THAÍS",grupo:"VERMELHO",branco:"Gui e Babi"},
{n:36,casal:"WELLINGTON E THATIANA",grupo:"VERMELHO",branco:"André e Luiza / Adair e Laís"},
{n:37,casal:"ALEX E JU (Jucimara)",grupo:"AMARELO",branco:"Rapha e Kelly"},
{n:38,casal:"PAULO (Cleber Paulo) E ANNE",grupo:"AMARELO",branco:"Ramon e Pâmela"},
{n:39,casal:"PEDRO E MARINA",grupo:"AMARELO",branco:"Paulo Jr e Verônica"},
{n:40,casal:"RICARDO E CAMILA",grupo:"AMARELO",branco:"Paulinho e Débora"},
{n:41,casal:"RONY E KARINA",grupo:"AMARELO",branco:"Clebinho e Sasa"},
{n:42,casal:"TARCISIO E ROBERTA",grupo:"AMARELO",branco:"Gilson e Márcia"},
{n:43,casal:"CLAYTON E CHENIA",grupo:"LARANJA",branco:"Léo e Claudia"},
{n:44,casal:"MILTON E JOANA",grupo:"LARANJA",branco:"Leonardo e Andressa"},
{n:45,casal:"PAULINHO (Paulo) E SILVANA",grupo:"LARANJA",branco:"Wilson e Fernanda"},
{n:46,casal:"PAULO E SIMONE",grupo:"LARANJA",branco:"Othiliel e Ariadne"},
{n:47,casal:"ROSEMBERG E JANAINA",grupo:"LARANJA",branco:"Judson e Lena"},
{n:48,casal:"WILSON E MARTA",grupo:"LARANJA",branco:"João e Cirlei"}
];

let presenca = {};
let modo = "faltantes";

const busca = document.getElementById("busca");
const resultados = document.getElementById("resultados");
const tituloLista = document.getElementById("tituloLista");
const conexao = document.getElementById("conexao");
const atualizacao = document.getElementById("atualizacao");
const btnFaltantes = document.getElementById("btnFaltantes");
const btnPresentes = document.getElementById("btnPresentes");

function normalizar(txt){
  return String(txt || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

function classeGrupo(grupo){
  return normalizar(grupo);
}

function horaAtual(){
  return new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
}

function listaFaltantes(){
  return dados.filter(x => !presenca[x.n]);
}

function listaPresentes(){
  return dados.filter(x => presenca[x.n]);
}

function ordenarPorNome(lista){
  return [...lista].sort((a,b) => a.casal.localeCompare(b.casal, "pt-BR"));
}

function atualizarContadores(){
  const total = dados.length;
  const chegaram = listaPresentes().length;
  const faltam = total - chegaram;

  document.getElementById("total").textContent = total;
  document.getElementById("presentes").textContent = chegaram;
  document.getElementById("faltam").textContent = faltam;

  btnFaltantes.textContent = `Faltantes (${faltam})`;
  btnPresentes.textContent = `Presentes (${chegaram})`;
}

async function setPresenca(numero, marcado){
  const casalRef = ref(db, "presenca/" + numero);
  try{
    if(marcado){
      await set(casalRef, true);
    }else{
      await remove(casalRef);
    }
  }catch(e){
    alert("Erro ao salvar no Firebase. Verifique a internet e as regras do banco.");
    console.error(e);
  }
}

function mudarModo(novoModo){
  modo = novoModo;
  busca.value = "";
  renderizar();
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderizar(){
  atualizarContadores();

  const termo = normalizar(busca.value.trim());
  let lista;

  if(termo.length > 0){
    tituloLista.textContent = "Resultado da busca";
    lista = dados.filter(x =>
      normalizar(x.casal).includes(termo) ||
      normalizar(x.grupo).includes(termo) ||
      normalizar(x.branco).includes(termo)
    );
  }else if(modo === "presentes"){
    tituloLista.textContent = "Casais presentes";
    lista = ordenarPorNome(listaPresentes());
  }else{
    tituloLista.textContent = "Casais que ainda faltam";
    lista = ordenarPorNome(listaFaltantes());
  }

  btnFaltantes.classList.toggle("ativa", modo === "faltantes");
  btnPresentes.classList.toggle("ativa", modo === "presentes");

  if(lista.length === 0){
    resultados.innerHTML = '<div class="vazio">Nenhum casal nesta lista.</div>';
    return;
  }

  resultados.innerHTML = lista.map(x => {
    const marcado = !!presenca[x.n];
    return `<div class="card ${classeGrupo(x.grupo)} ${marcado ? "checked" : ""}">
      <input class="check" type="checkbox" ${marcado ? "checked" : ""} onchange="window.setPresencaGlobal(${x.n}, this.checked)">
      <div class="info">
        <div class="casal">${x.n}. ${x.casal}</div>
        <div class="grupo">Grupo ${x.grupo}</div>
        <div class="branco">Casal branco: ${x.branco || "-"}</div>
      </div>
    </div>`;
  }).join("");
}

async function copiarFaltantes(){
  const faltantes = ordenarPorNome(listaFaltantes());
  let texto = `Faltam ${faltantes.length} casal(is):\n\n`;
  texto += faltantes.map(x => `${x.n}. ${x.casal} - Grupo ${x.grupo}`).join("\n");

  try{
    await navigator.clipboard.writeText(texto);
    alert("Lista dos faltantes copiada.");
  }catch(e){
    prompt("Copie a lista abaixo:", texto);
  }
}

onValue(presencaRef, (snapshot) => {
  presenca = snapshot.val() || {};
  conexao.textContent = "🟢 Conectado";
  conexao.className = "ok";
  atualizacao.textContent = "Última atualização: " + horaAtual();
  renderizar();
}, (error) => {
  conexao.textContent = "🔴 Desconectado";
  conexao.className = "off";
  alert("Erro ao conectar ao Firebase. Verifique as regras do Realtime Database.");
  console.error(error);
});

busca.addEventListener("input", renderizar);
busca.addEventListener("keyup", renderizar);
busca.addEventListener("search", renderizar);

window.setPresencaGlobal = setPresenca;
window.copiarFaltantes = copiarFaltantes;
window.mudarModo = mudarModo;

renderizar();
</script>
</body>
</html>
